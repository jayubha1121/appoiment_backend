<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Server logs</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #0e1115;
    --line: #2a2f38;
    --text: #d5d9e0;
    --muted: #7d8590;
    --accent: #e0a63a;
    --err: #ff6b6b;
    --warn: #e0a63a;
    --info: #6cb6ff;
    --debug: #8b949e;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-size: 13px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: flex; flex-direction: column; height: 100%; padding: 14px; gap: 10px; max-width: 1400px; margin: 0 auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .btn { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }

  .status { color: var(--muted); }
  .status.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fb950; margin-right: 6px; }
  .status.off::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-right: 6px; }

  .error { color: var(--err); }
  .box { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .row { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  .row .ts { color: var(--muted); }
  .row.error { color: var(--err); }
  .row.warn { color: var(--warn); }
  .row.info { color: var(--info); }
  .row.debug { color: var(--debug); }
  .row .src { color: var(--muted); }
  .box[data-filter="backend"] .row[data-source="admin"] { display: none; }
  .box[data-filter="admin"] .row[data-source="backend"] { display: none; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; color: inherit; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); }

  .gate { max-width: 360px; margin: 18vh auto 0; display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
  .gate h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .gate input { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Enter your log access token</h1>
  <input id="tokenInput" type="password" autocomplete="off" placeholder="LOG_ACCESS_TOKEN" aria-label="Log access token">
  <button class="btn" id="tokenBtn">View logs</button>
  <div class="error" id="gateError"></div>
</div>

<div class="app" id="app" hidden>
  <div class="bar">
    <div class="group" role="tablist">
      <button class="btn" role="tab" id="tabRuntime" aria-selected="true">Runtime logs</button>
      <button class="btn" role="tab" id="tabBuild" aria-selected="false">Build logs</button>
      <span class="status" id="status">connecting</span>
    </div>
    <div class="group">
      <label class="check">Source
        <select id="source" aria-label="Log source">
          <option value="all">All</option>
          <option value="backend">Backend</option>
          <option value="admin">Admin</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="autoScroll" checked> Auto-scroll</label>
      <button class="btn" id="clearBtn">Clear view</button>
      <button class="btn" id="signOut">Sign out</button>
    </div>
  </div>
  <div class="error" id="error"></div>
  <div class="box" id="box"></div>
</div>

<script>
(function () {
  var BASE = location.pathname.replace(/\/+$/, ''); // works wherever the router is mounted
  var MAX_ROWS = 2000;
  var STORE_KEY = 'log_token';

  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate'), app = $('app'), box = $('box');
  var token = '', es = null, tab = 'runtime';

  function show(el, on) { el.hidden = !on; }
  function api(p) { return BASE + '/api/' + p; }

  // ---- auth gate ----
  function tryToken(t) {
    return fetch(api('build'), { headers: { 'x-log-token': t } }).then(function (r) {
      if (r.status === 401) throw new Error('Wrong token.');
      if (r.status === 500) throw new Error('Server has no LOG_ACCESS_TOKEN set.');
      if (!r.ok) throw new Error('Server error (' + r.status + ').');
      return r.text();
    });
  }

  function login(t, remember) {
    $('gateError').textContent = '';
    tryToken(t).then(function (buildText) {
      token = t;
      try { if (remember) localStorage.setItem(STORE_KEY, t); } catch (e) {}
      show(gate, false); show(app, true);
      window.__buildText = buildText;
      selectTab('runtime');
      openStream();
    }).catch(function (e) {
      try { localStorage.removeItem(STORE_KEY); } catch (x) {}
      show(gate, true); show(app, false);
      $('gateError').textContent = e.message;
    });
  }

  // ---- rendering ----
  function addRow(entry) {
    var row = document.createElement('div');
    row.className = 'row ' + entry.level;
    row.dataset.source = entry.source || 'backend';
    var ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = entry.timestamp + ' ';
    // textContent, never innerHTML: log lines can contain anything.
    row.appendChild(ts);
    row.appendChild(document.createTextNode('[' + entry.level.toUpperCase() + '] '));
    var src = document.createElement('span');
    src.className = 'src';
    src.textContent = '[' + (entry.source || 'backend') + '] ';
    row.appendChild(src);
    row.appendChild(document.createTextNode(entry.message));
    box.appendChild(row);
    while (box.childElementCount > MAX_ROWS) box.removeChild(box.firstChild);
    if ($('autoScroll').checked) box.scrollTop = box.scrollHeight;
  }

  function openStream() {
    if (es) es.close();
    setStatus('connecting', '');
    es = new EventSource(api('stream') + '?token=' + encodeURIComponent(token));
    es.onopen = function () {
      // The server replays its buffer on every (re)connect, so start clean.
      if (tab === 'runtime') box.textContent = '';
      setStatus('live', 'live');
      $('error').textContent = '';
    };
    es.onmessage = function (ev) {
      if (tab !== 'runtime') { pending.push(ev.data); return; }
      try { addRow(JSON.parse(ev.data)); } catch (e) {}
    };
    es.onerror = function () { setStatus('reconnecting', 'off'); };
  }

  // Entries that arrive while the Build tab is open, replayed on switch back.
  var pending = [];

  function setStatus(text, cls) {
    var s = $('status');
    s.textContent = text;
    s.className = 'status ' + cls;
  }

  function selectTab(name) {
    tab = name;
    $('tabRuntime').setAttribute('aria-selected', name === 'runtime');
    $('tabBuild').setAttribute('aria-selected', name === 'build');
    box.textContent = '';
    if (name === 'build') {
      var which = $('source').value === 'admin' ? 'admin' : 'backend';
      fetch(api('build') + '?source=' + which, { headers: { 'x-log-token': token } })
        .then(function (r) { return r.text(); })
        .then(function (text) {
          var pre = document.createElement('pre');
          pre.textContent = text || '(build log is empty)';
          box.appendChild(pre);
        })
        .catch(function (e) { $('error').textContent = e.message; });
    } else {
      // Reload the buffered history, then keep streaming.
      fetch(api('runtime'), { headers: { 'x-log-token': token } })
        .then(function (r) { return r.json(); })
        .then(function (list) {
          box.textContent = '';
          pending = [];
          list.forEach(addRow);
          if (!list.length) {
            var p = document.createElement('div');
            p.className = 'empty';
            p.textContent = 'No logs yet. New lines appear here as they happen.';
            box.appendChild(p);
          }
        })
        .catch(function (e) { $('error').textContent = e.message; });
    }
  }

  // ---- events ----
  $('tokenBtn').onclick = function () { login($('tokenInput').value.trim(), true); };
  $('tokenInput').onkeydown = function (e) { if (e.key === 'Enter') $('tokenBtn').click(); };
  $('tabRuntime').onclick = function () { selectTab('runtime'); };
  $('tabBuild').onclick = function () { selectTab('build'); };
  $('source').onchange = function () {
    box.setAttribute('data-filter', $('source').value);
    if (tab === 'build') selectTab('build');
  };
  $('clearBtn').onclick = function () { if (tab === 'runtime') box.textContent = ''; };
  $('signOut').onclick = function () {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    if (es) es.close();
    token = ''; $('tokenInput').value = '';
    show(app, false); show(gate, true);
  };

  var saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (saved) login(saved, true);
})();
</script>
</body>
</html>
